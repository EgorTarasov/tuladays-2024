# GitLab CI Pipeline for Monorepo
# Generated by larek CLI
# Services: frontend, backend, bot

stages:

  - lint

  - test

  - build

  - docker

  - deploy


# =============================================================================
# Manual helper jobs
# =============================================================================

# Manual debug job — run quick diagnostics on CI runner when triggered manually
pipeline:debug:
  stage: deploy
  image: alpine:latest
  rules:
    - when: manual
  script:
    - echo "--- CI runner diagnostics ---"
    - uname -a || true
    - echo "--- env vars (filtered) ---"
    - env | grep -E 'CI_|GITLAB' || true
    - echo "--- build yaml ---"
    - cat .larek/build.yaml
    - echo "--- workspace top-level ---"
    - ls -la || true
    - echo "--- services in this pipeline ---"
    - |
      for svc in frontend backend bot; do
        echo "service: $svc" || true
      done
  allow_failure: true

# Manual restart job — attempts to trigger a new pipeline for the default branch
# Requires either `GITLAB_TRIGGER_TOKEN` or `CI_JOB_TOKEN` to be available as a variable
pipeline:restart:
  stage: deploy
  image: curlimages/curl:8.17.0
  rules:
    - when: manual
  script:
    - |
      if [ -z "${GITLAB_TRIGGER_TOKEN:-}" ] && [ -z "${CI_JOB_TOKEN:-}" ]; then
        echo "No trigger token provided (set GITLAB_TRIGGER_TOKEN or rely on CI_JOB_TOKEN).";
        echo "To trigger remotely, set project trigger token or provide CI_JOB_TOKEN.";
        exit 0;
      fi
    - echo "Triggering pipeline for project ${CI_PROJECT_ID} on ref ${CI_DEFAULT_BRANCH}..."
    - |
      TRIG_TOKEN=${GITLAB_TRIGGER_TOKEN:-$CI_JOB_TOKEN};
      API_URL="${CI_API_V4_URL:-https://${CI_SERVER_HOST:-gitlab.example.com}/api/v4}";
      curl -sS --fail -X POST "${API_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline" \
        -F token="${TRIG_TOKEN}" -F ref="${CI_DEFAULT_BRANCH}" || echo "Trigger API call failed (see above)";
  allow_failure: true
variables:
  NEXUS_REGISTRY: "${NEXUS_REGISTRY:-localhost:8081}"
  NEXUS_USER: "${NEXUS_USER:-admin}"
  NEXUS_PASSWORD: "${NEXUS_PASSWORD}"

# =============================================================================
# Shared Templates
# =============================================================================

.docker-build-template: &docker-build-template
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
  before_script:
    - docker login -u "${NEXUS_USER}" -p "${NEXUS_PASSWORD}" "${NEXUS_REGISTRY}"

# Rules for changes detection per service

.frontend-changes: &frontend_changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - frontend/**/*
    - if: $CI_COMMIT_TAG


.backend-changes: &backend_changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - backend/**/*
    - if: $CI_COMMIT_TAG


.bot-changes: &bot_changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - bot/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - bot/**/*
    - if: $CI_COMMIT_TAG



# =============================================================================
# Service Jobs
# =============================================================================


# -----------------------------------------------------------------------------
# frontend (typescript)
# -----------------------------------------------------------------------------





frontend:build:
  stage: build
  image: node:20-alpine
  <<: *frontend_changes

  cache:
    key: "${CI_COMMIT_REF_SLUG}-frontend"
    paths:
      - node_modules/

  before_script:
    - cd frontend

    - pnpm install --no-frozen-lockfile

  script:

    - pnpm build

  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week




# -----------------------------------------------------------------------------
# backend (go)
# -----------------------------------------------------------------------------



backend:lint:
  stage: lint
  image: golangci/golangci-lint:latest
  <<: *backend_changes

  cache:
    key: "${CI_COMMIT_REF_SLUG}-backend"
    paths:
      - .cache/go/pkg/mod/

  before_script:
    - cd backend

    - go mod download

  script:
    - golangci-lint run ./...
  allow_failure: true



backend:test:
  stage: test
  image: golang:1.23-alpine
  <<: *backend_changes

  cache:
    key: "${CI_COMMIT_REF_SLUG}-backend"
    paths:
      - .cache/go/pkg/mod/

  before_script:
    - cd backend

    - go mod download

  script:
    - go test -coverpkg=./... -coverprofile=coverage.out ./...
  coverage: '/coverage: \d+.\d+% of statements/'
  artifacts:
    reports:
      junit: backend/report.xml
    when: always



backend:build:
  stage: build
  image: golang:1.23-alpine
  <<: *backend_changes

  cache:
    key: "${CI_COMMIT_REF_SLUG}-backend"
    paths:
      - .cache/go/pkg/mod/

  before_script:
    - cd backend

    - go mod download

  script:

    - go build -o bin/backend ./cmd/main.go

  artifacts:
    paths:
      - backend/bin/
    expire_in: 1 week




backend:docker-1:
  stage: docker
  <<: *docker-build-template
  <<: *backend_changes
  script:
    - export IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    - docker build -f backend/Dockerfile.backend -t "${NEXUS_REGISTRY}/backend:${IMAGE_TAG}" backend
    - docker push "${NEXUS_REGISTRY}/backend:${IMAGE_TAG}"
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker tag "${NEXUS_REGISTRY}/backend:${IMAGE_TAG}" "${NEXUS_REGISTRY}/backend:latest"
        docker push "${NEXUS_REGISTRY}/backend:latest"
      fi


backend:docker-2:
  stage: docker
  <<: *docker-build-template
  <<: *backend_changes
  script:
    - export IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    - docker build -f backend/Dockerfile.migration -t "${NEXUS_REGISTRY}/backend:${IMAGE_TAG}" backend
    - docker push "${NEXUS_REGISTRY}/backend:${IMAGE_TAG}"
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker tag "${NEXUS_REGISTRY}/backend:${IMAGE_TAG}" "${NEXUS_REGISTRY}/backend:latest"
        docker push "${NEXUS_REGISTRY}/backend:latest"
      fi




# -----------------------------------------------------------------------------
# bot (python)
# -----------------------------------------------------------------------------



bot:lint:
  stage: lint
  image: python:3.10-slim
  <<: *bot_changes

  cache:
    key: "${CI_COMMIT_REF_SLUG}-bot"
    paths:
      - .cache/pip/
      - .venv/

  before_script:
    - cd bot

    - pip install poetry
    - poetry config virtualenvs.in-project true
    - poetry install

  script:
    - poetry run ruff check . && poetry run mypy .
  allow_failure: true






bot:docker:
  stage: docker
  <<: *docker-build-template
  <<: *bot_changes
  script:
    - export IMAGE_TAG="${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    - docker build -f bot/Dockerfile.telegram -t "${NEXUS_REGISTRY}/bot:${IMAGE_TAG}" bot
    - docker push "${NEXUS_REGISTRY}/bot:${IMAGE_TAG}"
    - |
      if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        docker tag "${NEXUS_REGISTRY}/bot:${IMAGE_TAG}" "${NEXUS_REGISTRY}/bot:latest"
        docker push "${NEXUS_REGISTRY}/bot:latest"
      fi


